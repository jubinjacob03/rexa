services:
  rexa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: rexa-bot:latest
    container_name: rexa-bot
    ports:
      - "3001:3001"
    env_file: .env
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 700M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
